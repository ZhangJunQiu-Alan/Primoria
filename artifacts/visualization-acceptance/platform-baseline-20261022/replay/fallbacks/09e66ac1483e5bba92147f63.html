function installThreeOrbitControlsFallback() {
  var THREE = window.THREE;
  if (!THREE || THREE.OrbitControls) return;

  function OrbitControls(object, domElement) {
    this.object = object;
    this.domElement = domElement || document;
    this.enabled = true;
    this.target = new THREE.Vector3();
    this.enableDamping = false;
    this.dampingFactor = 0.05;
    this.rotateSpeed = 1;
    this.zoomSpeed = 1;
    this.minDistance = 0;
    this.maxDistance = Infinity;
    this.autoRotate = false;
    this.autoRotateSpeed = 2;

    var scope = this;
    var listeners = Object.create(null);
    var spherical = new THREE.Spherical();
    var offset = new THREE.Vector3();
    var dragging = false;
    var startX = 0;
    var startY = 0;

    function syncFromCamera() {
      offset.copy(scope.object.position).sub(scope.target);
      spherical.setFromVector3(offset);
      if (!isFinite(spherical.radius) || spherical.radius === 0) spherical.radius = 1;
    }

    function clampAndApply() {
      spherical.phi = Math.max(0.01, Math.min(Math.PI - 0.01, spherical.phi));
      spherical.radius = Math.max(scope.minDistance, Math.min(scope.maxDistance, spherical.radius));
      offset.setFromSpherical(spherical);
      scope.object.position.copy(scope.target).add(offset);
      if (typeof scope.object.lookAt === 'function') scope.object.lookAt(scope.target);
      scope.dispatchEvent({ type: 'change' });
    }

    function elementSize() {
      var rect = scope.domElement && scope.domElement.getBoundingClientRect ? scope.domElement.getBoundingClientRect() : null;
      return {
        width: Math.max(1, (rect && rect.width) || scope.domElement.clientWidth || window.innerWidth || 1),
        height: Math.max(1, (rect && rect.height) || scope.domElement.clientHeight || window.innerHeight || 1)
      };
    }

    function onPointerDown(event) {
      if (!scope.enabled) return;
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      syncFromCamera();
      if (scope.domElement.setPointerCapture && event.pointerId != null) {
        try { scope.domElement.setPointerCapture(event.pointerId); } catch (_) {}
      }
      scope.dispatchEvent({ type: 'start' });
      if (event.preventDefault) event.preventDefault();
    }

    function onPointerMove(event) {
      if (!dragging || !scope.enabled) return;
      var size = elementSize();
      var dx = event.clientX - startX;
      var dy = event.clientY - startY;
      startX = event.clientX;
      startY = event.clientY;
      spherical.theta -= (2 * Math.PI * dx / size.width) * scope.rotateSpeed;
      spherical.phi -= (2 * Math.PI * dy / size.height) * scope.rotateSpeed;
      clampAndApply();
      if (event.preventDefault) event.preventDefault();
    }

    function onPointerUp(event) {
      if (!dragging) return;
      dragging = false;
      if (scope.domElement.releasePointerCapture && event.pointerId != null) {
        try { scope.domElement.releasePointerCapture(event.pointerId); } catch (_) {}
      }
      scope.dispatchEvent({ type: 'end' });
    }

    function onWheel(event) {
      if (!scope.enabled) return;
      syncFromCamera();
      var scale = Math.pow(0.95, scope.zoomSpeed);
      spherical.radius *= event.deltaY < 0 ? scale : 1 / scale;
      clampAndApply();
      if (event.preventDefault) event.preventDefault();
    }

    this.addEventListener = function(type, listener) {
      if (!listeners[type]) listeners[type] = [];
      if (listeners[type].indexOf(listener) === -1) listeners[type].push(listener);
    };
    this.removeEventListener = function(type, listener) {
      var list = listeners[type];
      if (!list) return;
      var index = list.indexOf(listener);
      if (index !== -1) list.splice(index, 1);
    };
    this.dispatchEvent = function(event) {
      var list = listeners[event.type];
      if (!list) return;
      list.slice().forEach(function(listener) { listener.call(scope, event); });
    };
    this.update = function() {
      syncFromCamera();
      if (this.autoRotate) spherical.theta -= (2 * Math.PI / 3600) * this.autoRotateSpeed;
      clampAndApply();
      return true;
    };
    this.dispose = function() {
      if (!scope.domElement || !scope.domElement.removeEventListener) return;
      scope.domElement.removeEventListener('pointerdown', onPointerDown);
      scope.domElement.removeEventListener('pointermove', onPointerMove);
      scope.domElement.removeEventListener('pointerup', onPointerUp);
      scope.domElement.removeEventListener('pointercancel', onPointerUp);
      scope.domElement.removeEventListener('wheel', onWheel);
    };
    this.reset = function() {
      syncFromCamera();
      clampAndApply();
    };

    syncFromCamera();
    if (this.domElement && this.domElement.addEventListener) {
      if (this.domElement.style) this.domElement.style.touchAction = 'none';
      this.domElement.addEventListener('pointerdown', onPointerDown);
      this.domElement.addEventListener('pointermove', onPointerMove);
      this.domElement.addEventListener('pointerup', onPointerUp);
      this.domElement.addEventListener('pointercancel', onPointerUp);
      this.domElement.addEventListener('wheel', onWheel, { passive: false });
    }
  }

  THREE.OrbitControls = OrbitControls;
}

window.__primoriaInstallThreeOrbitControls = installThreeOrbitControlsFallback;
installThreeOrbitControlsFallback();

<body>
  <main id="content">
    <div style="display:flex;flex-direction:column;gap:12px">
  <div class="lo-stage" style="padding:10px">
    <svg id="chart" viewBox="0 0 620 272" style="width:100%;height:auto;display:block"></svg>
    <div style="display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--lo-muted);margin-top:2px">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--lo-grid);border:1px solid var(--lo-border);vertical-align:-1px"></span> 原有收入</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--series-amber);vertical-align:-1px"></span> 定向补贴增量</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--series-pine);vertical-align:-1px"></span> 普惠补贴增量</span>
    </div>
  </div>
  <div style="font-size:11.5px;color:var(--lo-muted)">输入 = 你能直接设定的政策参数；计算结果 = 由它们推出来的后果，不能直接设定。</div>
  <div id="controls" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"></div>
  <div id="cards" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"></div>
  <div id="note" class="lo-card" style="padding:10px;font-size:12.5px;line-height:1.55"></div>
</div>
<script>
const G=[{n:'Q1 最低',hh:20,inc:1500},{n:'Q2',hh:20,inc:3000},{n:'Q3',hh:20,inc:5000},{n:'Q4',hh:20,inc:8000},{n:'Q5 最高',hh:20,inc:13000}];
const HH=100,$=function(i){return document.getElementById(i)};
function cv(a){var m=a.reduce(function(x,y){return x+y},0)/a.length;return Math.sqrt(a.reduce(function(x,y){return x+(y-m)*(y-m)},0)/a.length)/m}
const CVB=cv(G.map(function(g){return g.inc}));
const CTRLS=[
 {id:'budget',t:'总预算（万元/月）',min:1,max:20,step:0.5,val:6,f:function(v){return v.toFixed(1)+' 万元'}},
 {id:'thr',t:'定向资格线：月收入低于（元）',min:1000,max:16000,step:500,val:5000,f:function(v){return v+' 元'}},
 {id:'amt',t:'定向每户补贴额（元/月）',min:200,max:3000,step:100,val:1000,f:function(v){return v+' 元'}}];
$('controls').innerHTML=CTRLS.map(function(c){
 return '<div class="lo-card" style="padding:8px 10px"><div style="font-size:11.5px;color:var(--lo-muted);margin-bottom:6px">输入 · '+c.t+'</div>'
 +'<input id="'+c.id+'" type="range" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+c.val+'" style="width:100%;accent-color:var(--series-amber)">'
 +'<div style="font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums"><b id="'+c.id+'v"></b></div></div>'}).join('');
CTRLS.forEach(function(c){var i=$(c.id);$(c.id+'v').textContent=c.f(+i.value);
 i.addEventListener('input',function(){$(c.id+'v').textContent=c.f(+i.value);update()});});
function row(k,v){return '<div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0"><span style="color:var(--lo-muted)">'+k+'</span><b style="font-variant-numeric:tabular-nums">'+v+'</b></div>'}
function update(){
 var B=+$('budget').value*10000, th=+$('thr').value, s=+$('amt').value;
 var elig=G.map(function(g){return g.inc<th});
 var nT=G.reduce(function(a,g,i){return a+(elig[i]?g.hh:0)},0);
 var nom=nT*s, capped=nom>B+1e-6;
 var perT=nT?Math.min(s,B/nT):0, costT=nT*perT, perU=B/HH;
 var dT=(CVB-cv(G.map(function(g,i){return g.inc+(elig[i]?perT:0)})))*100;
 var dU=(CVB-cv(G.map(function(g){return g.inc+perU})))*100;
 var bot=G.slice(0,2).reduce(function(a,g,i){return a+(elig[i]?g.hh*perT:0)},0);
 var hitT=costT>0?bot/costT*100:0;
 $('cards').innerHTML=
  '<div class="lo-card" style="padding:10px;border-left:4px solid var(--series-amber)"><div style="font-size:12px;font-weight:600;margin-bottom:4px">定向补贴 · 计算结果</div>'
  +row('受益户数',nT+' / 100 户')+row('每户实得',Math.round(perT)+' 元')
  +row('预算使用率',(costT/B*100).toFixed(0)+'%')
  +row('低收入40%获预算',hitT.toFixed(0)+'%')
  +row('不平等下降',dT.toFixed(2)+' 百分点')
  +(capped?'<div style="font-size:11.5px;color:var(--series-amber);margin-top:6px">边界：名义支出 '+(nom/10000).toFixed(1)+' 万元 &gt; 预算，每户金额被压缩</div>':'')
  +'</div>'
  +'<div class="lo-card" style="padding:10px;border-left:4px solid var(--series-pine)"><div style="font-size:12px;font-weight:600;margin-bottom:4px">普惠补贴 · 计算结果</div>'
  +row('受益户数','100 / 100 户')+row('每户实得',Math.round(perU)+' 元')
  +row('预算使用率','100%')+row('低收入40%获预算','40%')
  +row('不平等下降',dU.toFixed(2)+' 百分点')
  +'<div style="font-size:11.5px;color:var(--lo-muted);margin-top:6px">每户金额不是输入，等于预算 ÷ 100 户</div></div>';
 var note;
 if(nT===0){note='<b>边界：无人符合。</b>资格线 '+th+' 元低于最低收入组（1500 元），定向补贴没有任何家庭能领到，支出与效果都是 0；普惠仍然每家发 '+Math.round(perU)+' 元。';}
 else if(capped){note='<b>边界：预算约束触发。</b>定向名义支出 '+(nom/10000).toFixed(1)+' 万元超过预算，每户只能拿到 '+Math.round(perT)+' 元（而非设定的 '+s+' 元）——"每户补贴额"其实是名义值，真正被预算卡住的是人均实得。';}
 else if(nT===HH){note='<b>边界：覆盖全体。</b>资格线覆盖 100 户，定向已经退化成普惠，区别只剩每户金额由你设定的 '+s+' 元决定，而不是预算平均分出的 '+Math.round(perU)+' 元。';}
 else{note='定向覆盖 '+nT+' 户、每户 '+Math.round(perT)+' 元，用掉 '+(costT/B*100).toFixed(0)+'% 的预算'
  +(costT<B*0.999?'（还剩 '+((B-costT)/10000).toFixed(1)+' 万元没用，可提额或放宽资格线）':'')+'；普惠则是 100 户各 '+Math.round(perU)+' 元。'
  +'命中率 '+hitT.toFixed(0)+'% 对 40%：定向把钱压向低收入、更精准，代价是覆盖窄或每户薄；普惠覆盖所有人，代价是大部分预算流向并不缺钱的中高收入组。';}
 $('note').innerHTML=note;
 var yMax=Math.max.apply(null,G.map(function(g,i){return Math.max(g.inc+(elig[i]?perT:0),g.inc+perU)}))*1.16;
 var W=620,H=272,padL=42,padB=32,padT=16,plotH=H-padB-padT,plotW=W-padL-10;
 function Y(v){return padT+plotH-(v/yMax)*plotH}
 var svg='';
 [0,5000,10000,15000].forEach(function(gv){if(gv>yMax)return;
  svg+='<line x1="'+padL+'" x2="'+(W-10)+'" y1="'+Y(gv)+'" y2="'+Y(gv)+'" stroke="var(--lo-grid)" stroke-width="1"/>'
   +'<text x="'+(padL-6)+'" y="'+(Y(gv)+4)+'" text-anchor="end" font-size="10" fill="var(--lo-muted)">'+(gv/1000)+'k</text>'});
 var gw=plotW/5,bw=34;
 G.forEach(function(g,i){
  var cx=padL+gw*(i+0.5);
  [{x:cx-bw-4,v:elig[i]?perT:0,c:'var(--series-amber)'},{x:cx+4,v:perU,c:'var(--series-pine)'}].forEach(function(b){
   var y0=Y(g.inc),y1=Y(g.inc+b.v);
   svg+='<rect x="'+b.x+'" y="'+y0+'" width="'+bw+'" height="'+(H-padB-y0)+'" fill="var(--lo-grid)" stroke="var(--lo-border)"/>';
   if(b.v>0){svg+='<rect x="'+b.x+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(2,y0-y1)+'" fill="'+b.c+'"/>'}
   svg+='<text x="'+(b.x+bw/2)+'" y="'+(y1-6)+'" text-anchor="middle" font-size="10" fill="var(--lo-ink)">'+(b.v>0?'+'+Math.round(b.v):'0')+'</text>'});
  svg+='<text x="'+cx+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="var(--lo-ink)">'+g.n+'</text>'
   +'<text x="'+cx+'" y="'+(H-padB+12)+'" text-anchor="middle" font-size="9.5" fill="var(--lo-muted)">'+g.hh+' 户 · '+g.inc+' 元</text>'});
 $('chart').innerHTML=svg;
}
update();
</script>
  </main>

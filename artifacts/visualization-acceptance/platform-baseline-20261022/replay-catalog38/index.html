，整个过程中它做的动作大致可以分成两类：一类是“移动”——把某个数字挪到别的位置；另一类是“比较”——判断两个数字谁大谁小。你觉得，这两类动作里，哪一类被执行的次数更多？\n\n很多人的直觉是“移动”。毕竟排序看起来就是在不停地搬东西，数字被换来换去，画面感很强。但真实的答案往往相反：比较的次数通常远多于移动的次数，而且随着数据规模变大，这个差距会越来越明显。换句话说，排序程序大部分时间都在做一件看起来很“轻”的事——比大小。\n\n这有点反直觉：明明什么都没搬，怎么就最费时间？原因在于，每一次“该不该移动”的决定，背后都要先做一次判断；而判断本身也是要花代价的。数据越多，需要做的判断就越多，比较也就越密集。\n\n所以，想真正理解排序，光盯着“数字怎么被搬走”是不够的，得先看清楚那个反复出现、默默消耗时间的动作——**比较**。","conceptIds":["t1c1_element_comparison"],"pedagogicalRole":"hook"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_2","type":"text","title":"本课的三步路线图","markdown":"接下来我们会沿着一条清晰的路线走三步，每一步都建立在前一步之上。\n\n第一步，学会**怎么比**：给定两个元素，比较到底能得出哪些结果，我们又该如何使用这些结果。第二步，学会**按什么顺序去比**：不是随便抓两个元素就比，而是有章法地沿着序列逐个检查相邻的一对，这就是相邻对扫描。第三步，学会**比出问题后怎么动手**：当比较告诉我们顺序不对时，用交换操作把元素放到正确的位置上。\n\n先会比较，再会安排比较的顺序，最后会依据比较结果采取行动——这三步串起来，就是本课要搭建的完整骨架。","conceptIds":["t1c1_element_comparison","t2c1_adjacent_pair_scan","t1c2_swap_operation"],"pedagogicalRole":"roadmap"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_3","type":"text","title":"元素比较：一次判定，三种结果","markdown":"想象两个同学背靠背比身高：你只需要看一眼谁更高、还是一样高，这个动作本身不会让任何人变高或变矮。数组中的**元素比较**也是同样的道理——它是对两个元素做一次判定，观察它们之间的大小关系，但**绝不改变数组的内容**。\n\n在程序中，比较操作通常写作 `compare(a[i], a[j])` 或直接使用比较运算符。无论底层如何实现，比较的返回值只有三种可能：\n\n- **小于**：$a[i] \u003c a[j]$，表示左边的元素更小；\n- **相等**：$a[i] = a[j]$，表示两个元素的值相同；\n- **大于**：$a[i] \u003e a[j]$，表示左边的元素更大。\n\n这三种结果穷尽了所有可能，不存在第四种情况。比较是一个**纯观察**动作：它读取两个元素的值并给出判定，但不会移动、修改或删除任何一个元素。初学者常常只关注“小于”和“大于”，而忽略“相等”这一分支。然而，相等情况恰恰是后续讨论**排序稳定性**的关键——当两个元素值相同时，算法是否保持它们原有的相对顺序，就取决于比较操作如何对待“相等”这一结果。","conceptIds":["t1c1_element_comparison"],"pedagogicalRole":"explanation"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_4","type":"text","title":"在具体数组中看一次比较","markdown":"考虑数组 $a = [7, 3, 9, 3]$，索引从 $0$ 开始。假设程序执行比较 $a[0]$ 与 $a[1]$，也就是比较 $7$ 和 $3$。程序读取这两个值后判定：$7 \u003e 3$，因此返回“大于”。数组本身保持 $[7, 3, 9, 3]$ 不变。\n\n再看比较 $a[1]$ 与 $a[3]$，即 $3$ 和 $3$。程序读取两个值后发现它们相同，于是判定为“不大于”——也就是返回“相等”。注意，这里程序**不会**因为两个元素相等就认为它们“没有区别”：在排序算法中，这两个 $3$ 是数组中两个不同的位置，比较操作只是报告它们的值相同，至于是否交换、是否保持先后顺序，则完全由后续的交换操作和算法逻辑决定。\n\n通过这个例子可以看到，比较操作只关心两个指定位置上的值，与数组的长度、其他元素的值都无关。每一次比较都是独立、瞬时的一次判定。","conceptIds":["t1c1_element_comparison"],"pedagogicalRole":"example"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_5","alt":"两个高亮的数组格子并排，中间有一个表示“小于”的符号，其余格子淡化为背景。","type":"image","model":"gemini-3.1-flash-lite-image","title":"比较的视觉形态","prompt":"A clean, minimal educational illustration showing two adjacent rectangular array cells side by side, both highlighted with a soft colored outline and a subtle glow to indicate they are the active elements being compared. The left cell contains a simple abstract shape representing a smaller value, and the right cell contains a slightly larger abstract shape representing a larger value. Between the two cells, a large bold comparison symbol made of simple geometric shapes visually indicates that the left is less than the right. The remaining array cells fade into a light gray background, out of focus and visually de-emphasized. The overall composition is flat, modern, and uncluttered, with no arrows, no flow lines, no text, no numbers, and no labels.","status":"ready","assetId":"media_zhiczvasmvjjoe3w","caption":"注意画面中只有两个格子被高亮，它们之间有一个醒目的比较结果符号，其余格子都退到背景中。这表示一次比较只发生在两个特定位置之间，与数组中的其他元素无关。","imageUrl":"/api/media/assets/media_zhiczvasmvjjoe3w","imageKind":"structure_diagram","conceptIds":["t1c1_element_comparison"],"aspectRatio":"16:9","pedagogicalRole":"example"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_6","html":"\u003cdiv style=\"font-family:sans-serif;max-width:640px;margin:0 auto;padding:16px;\"\u003e\n  \u003cp style=\"margin:0 0 12px;line-height:1.6;\"\u003e数组 \u003ccode\u003ea = [7, 3, 9, 3, 5]\u003c/code\u003e。请先在心里预测：你选的两个位置上的元素，谁大谁小，还是相等？然后点击两个格子验证。\u003c/p\u003e\n  \u003cdiv id=\"cells\" style=\"display:flex;gap:8px;justify-content:center;margin:16px 0;\"\u003e\u003c/div\u003e\n  \u003cdiv id=\"result\" style=\"text-align:center;font-size:28px;font-weight:bold;min-height:40px;color:#1d4ed8;\"\u003e\u003c/div\u003e\n  \u003cp id=\"hint\" style=\"text-align:center;color:#6b7280;margin-top:8px;\"\u003e已选：无\u003c/p\u003e\n  \u003cbutton id=\"reset\" style=\"display:block;margin:12px auto 0;padding:8px 16px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;cursor:pointer;\"\u003e重置选择\u003c/button\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n  const arr = [7, 3, 9, 3, 5];\n  const cellsEl = document.getElementById('cells');\n  const resultEl = document.getElementById('result');\n  const hintEl = document.getElementById('hint');\n  let selected = [];\n\n  function renderCells() {\n    cellsEl.innerHTML = '';\n    arr.forEach((val, i) =\u003e {\n      const cell = document.createElement('button');\n      cell.textContent = val;\n      cell.dataset.index = i;\n      cell.style.cssText = 'width:56px;height:56px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:22px;cursor:pointer;transition:all .15s;';\n      if (selected.includes(i)) {\n        cell.style.borderColor = '#f59e0b';\n        cell.style.background = '#fef3c7';\n        cell.style.boxShadow = '0 0 0 3px rgba(245,158,11,.35)';\n      }\n      cell.addEventListener('click', () =\u003e handleClick(i));\n      cellsEl.appendChild(cell);\n    });\n  }\n\n  function handleClick(i) {\n    if (selected.includes(i)) {\n      selected = selected.filter(x =\u003e x !== i);\n    } else if (selected.length \u003c 2) {\n      selected.push(i);\n    } else {\n      selected = [i];\n    }\n    renderCells();\n    updateResult();\n  }\n\n  function updateResult() {\n    if (selected.length \u003c 2) {\n      resultEl.textContent = '';\n      hintEl.textContent = selected.length === 1 ? `已选：位置 ${selected[0]}（值 ${arr[selected[0]]}），请再选一个位置` : '已选：无';\n      return;\n    }\n    const [i, j] = selected;\n    const a = arr[i], b = arr[j];\n    let symbol = '';\n    if (a \u003c b) symbol = '\u003c';\n    else if (a \u003e b) symbol = '\u003e';\n    else symbol = '=';\n    resultEl.textContent = `${a} ${symbol} ${b}`;\n    hintEl.textContent = `比较位置 ${i} 与 ${j}：${a} ${symbol} ${b}`;\n  }\n\n  document.getElementById('reset').addEventListener('click', () =\u003e {\n    selected = [];\n    renderCells();\n    updateResult();\n  });\n\n  renderCells();\n  updateResult();\n\u003c/script\u003e","type":"visual","title":"亲手比较：让 \u003c、=、\u003e 在指尖出现","engine":"html","conceptIds":["t1c1_element_comparison"],"description":"先预测两个数组元素的大小关系，再点击格子验证。观察中间实时浮现的 \u003c、=、\u003e 判定结果，并留意相等元素带来的“=”情形。","pedagogicalRole":"deepening"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_7","type":"quiz","title":"比较操作小测","questions":[{"id":"q1","kind":"single","choices":[{"id":"a","text":"true"},{"id":"b","text":"false"},{"id":"c","text":"3"},{"id":"d","text":"5"}],"question":"数组为 $a = [5, 3, 8]$。执行比较 $a[0] \u003e a[1]$，其返回值是什么？","conceptId":"t1c1_element_comparison","correctId":"a","explanation":"$a[0] = 5$，$a[1] = 3$，因为 $5 \u003e 3$ 成立，所以比较返回布尔值 true。比较只返回真假，不会返回元素本身的值，因此 3 和 5 都不对。"},{"id":"q2","kind":"single","choices":[{"id":"a","text":"变成 $[3, 5, 8]$，因为比较会交换两个元素"},{"id":"b","text":"保持不变，仍为 $[5, 3, 8]$，因为比较不修改数组"},{"id":"c","text":"变成 $[5, 8, 3]$，因为比较会把较大的元素移到后面"},{"id":"d","text":"变成 $[5, 3]$，因为比较会删除被比较的元素"}],"question":"执行比较 $a[1] \u003c a[2]$（其中 $a = [5, 3, 8]$）之后，数组 $a$ 的内容会怎样？","conceptId":"t1c1_element_comparison","correctId":"b","explanation":"比较操作只读取两个元素并返回真假结果，它本身没有副作用，不会改变数组内容。交换元素是另一个独立操作，只有显式执行交换时数组才会改变。"},{"id":"q3","kind":"single","choices":[{"id":"a","text":"$a[0] \u003e a[1]$ 为 true，因为下标 0 更靠前"},{"id":"b","text":"$a[0] \u003c a[1]$ 为 true，因为下标 1 更靠后"},{"id":"c","text":"$a[0] == a[1]$ 为 true，且 $a[0] \u003e a[1]$ 与 $a[0] \u003c a[1]$ 都为 false"},{"id":"d","text":"两个相等元素无法比较，会报错"}],"question":"数组为 $a = [4, 4, 7]$。比较 $a[0]$ 与 $a[1]$，下列判断正确的是？","conceptId":"t1c1_element_comparison","correctId":"c","explanation":"比较依据的是元素的值，而不是下标位置。$a[0] = 4$ 与 $a[1] = 4$ 值相等，所以相等比较为 true，而大于、小于比较都为 false。相等元素完全可以正常比较。"}],"conceptIds":["t1c1_element_comparison"],"pedagogicalRole":"assessment"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_8","type":"text","title":"相邻对扫描的遍历顺序与边界","markdown":"相邻对扫描的核心规则只有一句话：**按索引从左到右，每一步只看 $(i, i+1)$ 这一对相邻元素**。想象你沿着一条队伍从队首走到队尾，每走一步，你只停下来问自己一个问题：\"站在我面前的这两个人，顺序对吗？\"问完之后就往前走一步，再问下一对，直到走完整条队伍。\n\n一趟扫描的起点是 $i = 0$，也就是数组的第一个元素。此时你比较的是下标 $0$ 和下标 $1$ 这一对。接着 $i$ 每次增加 $1$，比较 $(1, 2)$、$(2, 3)$……一直推进下去。扫描的终点是 $i = n - 2$，也就是倒数第二个元素。为什么不是 $n - 1$？因为当 $i = n - 1$ 时，$i + 1$ 已经越界，数组里根本没有第 $n$ 个元素可以拿来配对。\n\n所以，对于长度为 $n$ 的数组，一趟完整的相邻对扫描恰好包含 $n - 1$ 次比较，最后一对永远是 $(n-2, n-1)$。例如长度为 $4$ 的数组，扫描依次比较 $(0,1)$、$(1,2)$、$(2,3)$，共 $3$ 对。这个边界规则保证了每一步都有实实在在的两个相邻元素可以观察，不会踩空。","conceptIds":["t2c1_adjacent_pair_scan"],"pedagogicalRole":"explanation"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_9","type":"text","title":"手写式走一遍相邻对扫描","markdown":"以数组 $[5, 1, 4, 2]$ 为例，长度 $n = 4$，一趟扫描应包含 $3$ 次相邻对比较。我们一步一步走，**只记录发现，暂不交换**。\n\n**第 1 步**：比较下标 $(0, 1)$，即 $5$ 和 $1$。因为 $5 \u003e 1$，发现一个逆序。  \n**第 2 步**：比较下标 $(1, 2)$，即 $1$ 和 $4$。因为 $1 \u003c 4$，顺序正确，没有发现。  \n**第 3 步**：比较下标 $(2, 3)$，即 $4$ 和 $2$。因为 $4 \u003e 2$，又发现一个逆序。\n\n走完这一趟，我们一共发现了两个逆序：$(0,1)$ 和 $(2,3)$。注意，扫描本身只是\"观察\"和\"记录\"，数组的内容在这一步并没有发生任何改变。那么问题来了：发现了逆序之后，我们该怎么办？是立刻交换这两个元素，还是先记下来等扫描结束后统一处理？这个\"怎么办\"的答案，正是下一个概念要解决的核心。","conceptIds":["t2c1_adjacent_pair_scan"],"pedagogicalRole":"example"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_10","alt":"一个由四个空格组成的数组，上方有从左到右的箭头，中间两个相邻格子被方框框住，左侧格子用淡灰色标记为已扫描。","type":"image","model":"gemini-3.1-flash-lite-image","title":"扫描方向与相邻关系示意图","prompt":"A simple horizontal array of four empty rectangular cells drawn as a row. Above the array, a bold directional arrow points from left to right, indicating the scan direction. A highlighted rectangular frame encloses exactly two adjacent cells in the middle of the array, showing the current pair being examined. The cells to the left of the highlighted pair are shaded with a light gray tint to indicate they have already been scanned. The cells to the right remain white and unshaded. The overall style is clean, minimal, and educational, with no text, no numbers, no labels, and no arrows other than the main directional arrow.","status":"ready","assetId":"media_6elxv7vfmvjjoek2","caption":"观察箭头的方向：扫描从左向右推进。方框只框住两个相邻格子，表示当前正在检查的这一对；淡灰色区域表示已经走过的部分，右侧白色区域表示尚未扫描的部分。","imageUrl":"/api/media/assets/media_6elxv7vfmvjjoek2","imageKind":"structure_diagram","conceptIds":["t2c1_adjacent_pair_scan"],"aspectRatio":"16:9","pedagogicalRole":"example"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_11","type":"visual","title":"单步执行一趟扫描：观察逆序被处理","engine":"interactive","conceptIds":["t2c1_adjacent_pair_scan"],"description":"从数组左端开始，逐对检查相邻元素。每一步先判断当前这对元素是否为逆序，再继续单步执行。如果左边的元素大于右边的元素，就交换它们；否则保持不动。扫描结束后，观察最大值最终落在数组的哪个位置。","interactive":{"config":{"values":[7,3,9,2,6],"algorithm":"bubble"},"componentId":"cs.sorting-steps","configVersion":1},"pedagogicalRole":"deepening"},{"id":"blk_lsn_qz9t7vkdmvjjnncn_12","type":"quiz","title":"相邻对扫描：顺序、边界与一趟效果","questions":[{"id":"q1","kind":"single","choices":[{"id":"a","text":"$n$ 次"},{"id":"b","text":"$n-1$ 次"},{"id":"c","text":"$n+1$ 次"},{"id":"d","text":"$\\lfloor n/2 \\rfloor$ 次"}],"question":"对一个长度为 $n$ 的数组做一趟相邻对扫描（从左到右依次比较相邻的两个元素），一共需要比较多少次？","conceptId":"t2c1_adjacent_pair_scan","correctId":"b","explanation":"相邻对是 $(a_0,a_1),(a_1,a_2),\\dots,(a_{n-2},a_{n-1})$，起点从下标 $0$ 到 $n-2$，共 $n-1$ 对，因此一趟扫描比较 $n-1$ 次。"},{"id":"q2","kind":"single","choices":[{"id":"a","text":"$(n-1,\\ n)$"},{"id":"b","text":"$(n-2,\\ n-1)$"},{"id":"c","text":"$(0,\\ 1)$"},{"id":"d","text":"$(n-1,\\ 0)$"}],"question":"数组下标从 $0$ 开始，长度为 $n$。一趟从左到右的相邻对扫描中，最后一对比较的是哪两个下标？","conceptId":"t2c1_adjacent_pair_scan","correctId":"b","explanation":"最后一对是数组末尾的两个元素，即下标 $n-2$ 与 $n-1$。下标 $n$ 越界，$(0,1)$ 是第一对，$(n-1,0)$ 不是相邻对。"},{"id":"q3","kind":"single","choices":[{"id":"a","text":"$[1,\\ 4,\\ 2,\\ 5]$"},{"id":"b","text":"$[1,\\ 2,\\ 4,\\ 5]$"},{"id":"c","text":"$[5,\\ 4,\\ 2,\\ 1]$"},{"id":"d","text":"$[1,\\ 5,\\ 4,\\ 2]$"}],"question":"对数组 $[5,\\ 1,\\ 4,\\ 2]$ 做一趟从左到右的相邻对扫描（每次比较相邻两元素，若左边大于右边则交换），一趟结束后数组是什么？","conceptId":"t2c1_adjacent_pair_scan","correctId":"a","explanation":"依次比较：$(5,1)$ 交换得 $[1,5,4,2]$；$(5,4)$ 交换得 $[1,4,5,2]$；$(5,2)$ 交换得 $[1,4,2,5]$。一趟结束后最大值 $5$ 一定被推到最右端（下标 $n-1$）就位，但其余元素未必有序，所以不是 $[1,2,4,5]$。"}],"conceptIds":["t2c1_adjacent_pair_scan"],"pedagogicalRole":"assessment"}],"estimatedMinutes":null,"version":1,"createdAt":1792673735926,"updatedAt":1792673771953},{"id":"lsn_uvkympgmmvjjnncn","title":"Bubble Sort: Floating Up Maxima and Early Exit","description":"掌握未排序区边界如何收缩、最大元素如何上浮，以及在没有交换发生时提前结束排序。","role":"new","progress":"not_started","status":"planned","sortKey":2,"topicId":"t2_bubble_sort_passes_and_early_exit","conceptIds":["t2c2_largest_element_bubbling","t2c3_early_exit_optimization","t3c1_unsorted_region_boundary"],"triggeredFrom":null,"blocks":null,"estimatedMinutes":null,"version":1,"createdAt":1792673735926,"updatedAt":1792673741175},{"id":"lsn_cvo7ta85mvjjnncn","title":"Selection Sort: Scanning for the Minimum","description":"学会每轮扫描未排序区找出最小值，只交换一次就把它放到有序前缀的末尾。","role":"new","progress":"not_started","status":"planned","sortKey":3,"topicId":"t3_selection_sort_minimum_search","conceptIds":["t3c2_minimum_scan","t3c3_single_swap_placement","t4c1_sorted_prefix_invariant"],"triggeredFrom":null,"blocks":null,"estimatedMinutes":null,"version":1,"createdAt":1792673735926,"updatedAt":1792673741249},{"id":"lsn_ocz1qdbimvjjnncn","title":"Insertion Sort: Shifting, Inserting, Binary Split","description":"能够把关键字插入已排序部分，用元素移位腾出位置，并用二分查找定位插入点。","role":"new","progress":"not_started","status":"planned","sortKey":4,"topicId":"t4_insertion_sort_shifting_and_insertion","conceptIds":["t4c2_element_shifting","t4c3_key_insertion","t5c1_recursive_halving"],"triggeredFrom":null,"blocks":null,"estimatedMinutes":null,"version":1,"createdAt":1792673735926,"updatedAt":1792673741332},{"id":"lsn_ewsxs7t3mvjjnncn","title":"Merging Lists and Choosing a Pivot","description":"理解如何合并两个有序列表、沿归并树重组结果，以及选取枢轴来划分数据。","role":"new","progress":"not_started","status":"planned","sortKey":5,"topicId":"t5_merge_sort_divide_and_merge","conceptIds":["t5c2_two_list_merge","t5c3_merge_tree_recombination","t6c1_pivot_selection"],"triggeredFrom":null,"blocks":null,"estimatedMinutes":null,"version":1,"createdAt":1792673735926

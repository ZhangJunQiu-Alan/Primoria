    <div style="max-width:790px;margin:0 auto;display:flex;flex-direction:column;gap:10px">

      <input class="sl" id="B" type="range" min="0" max="10" step="0.5" value="3">
      <div class="lb">定向门槛：收入 ≤ <b class="num" id="Tv">2.5</b> 千元才发</div>

<script>
var INC=[1.5,2.5,4,6,12], NG=20, NT=100, NM=['最低20%','次低20%','中间20%','次高20%','最高20%'];
var g=function(i){return document.getElementById(i)};
function f(n){return n>=1000?Math.round(n).toLocaleString():Math.round(n)}
function S(){
  var B=+g('B').value, T=+g('T').value, phi=+g('P').value, c=+g('C').value;
  var k=0; for(var i=0;i<5;i++) if(INC[i]<=T+1e-9) k++;
  var nE=k*NG, Bt=B*1e8;
  var admin=Math.min(c*nE*1e4,Bt), avail=Bt-admin;
  var sT=avail/(nE*1e4), sU=Bt/(NT*1e4);
  return {B:B,T:T,phi:phi,c:c,k:k,nE:nE,Bt:Bt,admin:admin,avail:avail,sT:sT,sU:sU,netT:(1-phi)*sT,netU:(1-phi)*sU};
}
function draw(s){
  var raw=Math.max(s.netT,s.netU,10), st=Math.pow(10,Math.floor(Math.log10(raw)))/2, ymax=Math.ceil(raw/st)*st;
  var L=68,R=622,Y0=28,Y1=222,gw=(R-L)/5,h='';
  h+='<text class="ts" x="8" y="16">每户每月净补贴（元）</text>';
  if(s.k>0) h+='<rect x="'+L+'" y="'+Y0+'" width="'+(gw*s.k)+'" height="'+(Y1-Y0)+'" style="fill:var(--lo-highlight);opacity:.45"/>';
  h+='<text class="ts" x="'+(L+6)+'" y="'+(Y0+13)+'" style="font-size:9px">门槛内 '+s.nE+' 万户</text>';
  for(var i=0;i<=4;i++){
    var y=Y1-(Y1-Y0)*i/4;
    h+='<line x1="'+L+'" y1="'+y+'" x2="'+R+'" y2="'+y+'" style="stroke:var(--lo-grid)"/>';
    h+='<text class="ts" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(ymax*i/4)+'</text>';
  }
  h+='<line x1="'+L+'" y1="'+Y1+'" x2="'+R+'" y2="'+Y1+'" style="stroke:var(--lo-border)"/>';
  INC.forEach(function(v,i){
    var cx=L+gw*(i+0.5), hT=(i<s.k?s.netT:0), hU=s.netU;
    var pH=Math.max(hT/ymax*(Y1-Y0),1), pU=Math.max(hU/ymax*(Y1-Y0),1);
    h+='<rect class="c-coral" x="'+(cx-23)+'" y="'+(Y1-pH)+'" width="21" height="'+pH+'" rx="2"/>';
    h+='<rect class="c-blue" x="'+(cx+2)+'" y="'+(Y1-pU)+'" width="21" height="'+pU+'" rx="2"/>';
    if(hT>0) h+='<text class="ts" x="'+(cx-12.5)+'" y="'+(Y1-pH-4)+'" text-anchor="middle" style="font-size:9px">'+f(hT)+'</text>';
    h+='<text class="ts" x="'+(cx+12.5)+'" y="'+(Y1-pU-4)+'" text-anchor="middle" style="font-size:9px">'+f(hU)+'</text>';
    h+='<text class="ts" x="'+cx+'" y="'+(Y1+16)+'" text-anchor="middle">'+NM[i]+'</text>';
    h+='<text class="ts" x="'+cx+'" y="'+(Y1+30)+'" text-anchor="middle" style="font-size:9px">'+v+'k/月</text>';
  });
  h+='<rect class="c-coral" x="'+(R-118)+'" y="7" width="10" height="10" rx="2"/><text class="ts" x="'+(R-104)+'" y="16">定向</text>';
  h+='<rect class="c-blue" x="'+(R-58)+'" y="7" width="10" height="10" rx="2"/><text class="ts" x="'+(R-44)+'" y="16">普惠</text>';
  g('chart').innerHTML=h;
}
function bar(label,admin,phi,tr,Bt){
  if(Bt<=0) return '<div class="ts">'+label+'：预算为 0，没有资金可分配</div>';
  var pc=function(x){return Math.max(0,x/Bt*100)};
  var n=pc(tr*(1-phi)), r=pc(tr*phi), a=pc(Math.min(admin,Bt));
  var seg=function(w,col,brd,txt){
    if(w<=0.2) return '';
    return '<div style="flex:0 0 '+w+'%;background:'+col+';border-right:1px solid '+brd+';display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--lo-ink);overflow:hidden;white-space:nowrap">'+(w>14?txt:'')+'</div>';
  };
  return '<div class="lb" style="margin:0 0 3px">'+label+'</div>'+
    '<div style="display:flex;height:22px;border:1px solid var(--lo-border);border-radius:4px;overflow:hidden">'+
    seg(n,'var(--series-pine-fill)','var(--series-pine)','家庭净得')+
    seg(r,'var(--series-rose-fill)','var(--series-rose)','房东租金')+
    seg(a,'var(--series-amber-fill)','var(--series-amber)','核查成本')+'</div>';
}
function update(){
  var s=S();
  g('Bv').textContent=s.B.toFixed(1);
  g('Tv').textContent=s.T.toFixed(1);
  g('Pv').textContent=Math.round(s.phi*100);
  g('Cv').textContent=s.c;
  var ratio=s.netU>0?(s.netT/s.netU).toFixed(2):'—';
  g('out').innerHTML=
    '<div>覆盖户数：<b>定向 '+s.nE+' 万户</b> ｜ 普惠 '+NT+' 万户</div>'+
    '<div>每户毛补贴：定向 <span class="num">'+f(s.sT)+'</span> ｜ 普惠 <span class="num">'+f(s.sU)+'</span> 元</div>'+
    '<div>被租金吃掉：定向 <span class="num">'+f(s.sT*s.phi)+'</span> ｜ 普惠 <span class="num">'+f(s.sU*s.phi)+'</span> 元</div>'+
    '<div>每户净得：<b>定向 <span class="num">'+f(s.netT)+'</span> ｜ 普惠 <span class="num">'+f(s.netU)+'</span> 元</b></div>'+
    '<div>定向核查成本：<span class="num">'+(s.admin/1e8).toFixed(2)+'</span> 亿元</div>'+
    '<div>最低收入组受益倍数：<span class="num">'+ratio+'</span> 倍</div>';
  g('sT').innerHTML=bar('定向：每户发 '+f(s.sT)+' 元 × '+s.nE+' 万户',s.admin,s.phi,s.avail,s.Bt);
  g('sU').innerHTML=bar('普惠：每户发 '+f(s.sU)+' 元 × 100 万户',0,s.phi,s.Bt,s.Bt);
  g('expl').innerHTML='同样的 <b><span class="num">'+s.B.toFixed(1)+'</span> 亿元</b> 预算：定向只能发给收入不超过 '+s.T.toFixed(1)+
    ' 千元的 <b>'+s.nE+' 万户</b>，所以每户能拿到 <span class="num">'+f(s.sT)+'</span> 元；普惠要摊给 100 万户，每户只有 <span class="num">'+f(s.sU)+
    '</span> 元。房东截留 '+Math.round(s.phi*100)+'% 之后，两类家庭的净得变成 <b><span class="num">'+f(s.netT)+'</span></b> 和 <b><span class="num">'+f(s.netU)+
    '</span></b> 元。注意一个反直觉的量：核查成本是定向独有的固定开销，它从这个池子里扣，所以门槛定得越窄，每户反而越经得起这笔固定成本。';
  var b=[];
  if(s.B===0) b.push('预算 = 0：两方案净补贴都塌到 0，柱状图归零。');
  if(s.T>=12-1e-9) b.push('门槛 ≥ 12 千元：定向覆盖全部 5 组，此时它已经变成普惠，却还要多付核查成本 —— 所以净得反而低于普惠。');
  if(s.B>0 && s.admin>=s.Bt-1e-6) b.push('核查成本吃光整个预算：定向可用补贴 = 0，再增加预算要越过这条线才开始真正发钱。');
  if(s.phi>=0.849) b.push('截留率接近上限 90%：补贴几乎全部变成房东租金，两方案净得都趋近于 0，差别被压缩。');
  if(!b.length) b.push('当前未触发边界：门槛内 '+s.k+' 组有资格，预算在扣掉核查成本后仍有 <b>'+(s.avail/1e8).toFixed(2)+' 亿元</b> 真正发到家庭。');
  g('bnd').innerHTML='<div class="ts" style="margin-bottom:3px"><b>④ 边界情况</b></div>'+
    '<ul style="margin:0;padding-left:18px;line-height:1.65">'+b.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
}
['B','T','P','C'].forEach(function(id){g(id).addEventListener('input',function(){update();draw(S())})});
update(); draw(S());
</script>

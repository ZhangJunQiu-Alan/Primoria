services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: primoria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: primoria
      POSTGRES_USER: primoria_app
      POSTGRES_PASSWORD: primoria_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - primoria-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primoria_app -d primoria"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  primoria-postgres-data:

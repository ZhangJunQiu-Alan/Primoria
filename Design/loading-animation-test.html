<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primoria · Loading Animation Preview — The Orrery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════
       DESIGN TOKENS — Vintage Botanical
    ═══════════════════════════════════════════════ */
    :root {
      --bg:            #F7F3EC;
      --bg-card:       #FEFAF5;
      --primary:       #7A9E7E;
      --primary-light: #A8C5AC;
      --primary-dark:  #5C7D60;
      --secondary:     #C4956A;
      --lavender:      #A99AB4;
      --amber:         #D4A870;
      --text:          #3D342A;
      --text-sub:      #6B5D52;
      --text-muted:    #9B8E85;
      --border:        rgba(221,211,195,0.7);
      --shadow:        rgba(90,70,50,0.09);
    }

    [data-theme='dark'] {
      --bg:            #02060f;
      --bg-card:       #0a1628;
      --primary:       #60a5fa;
      --primary-light: #93c5fd;
      --primary-dark:  #d3def4;
      --secondary:     #c4b5fd;
      --lavender:      #a78bfa;
      --amber:         #fbbf24;
      --text:          #e2e8f4;
      --text-sub:      #acc0dd;
      --text-muted:    #6b8baa;
      --border:        rgba(148,197,255,0.15);
      --shadow:        rgba(0,0,0,0.45);
    }

    /* ═══════════════════════════════════════════════
       BASE
    ═══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'DM Sans', 'Avenir Next', sans-serif;
    }

    body {
      background-color: var(--bg);
      transition: background-color 0.6s ease;
      overflow: hidden;
      position: relative;
    }

    /* ═══════════════════════════════════════════════
       WATERCOLOR BACKGROUND WASH
    ═══════════════════════════════════════════════ */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 62% 52% at 12% 18%, rgba(168,197,172,0.20) 0%, transparent 70%),
        radial-gradient(ellipse 50% 62% at 88% 78%, rgba(196,149,106,0.14) 0%, transparent 70%),
        radial-gradient(ellipse 58% 46% at 52% 52%, rgba(169,154,180,0.11) 0%, transparent 70%),
        radial-gradient(ellipse 44% 56% at 78% 16%, rgba(212,184,150,0.12) 0%, transparent 70%);
      transition: opacity 0.6s ease;
    }

    [data-theme='dark'] body::before {
      background:
        radial-gradient(ellipse 62% 52% at 12% 18%, rgba(96,165,250,0.13) 0%, transparent 70%),
        radial-gradient(ellipse 50% 62% at 88% 78%, rgba(168,85,247,0.11) 0%, transparent 70%),
        radial-gradient(ellipse 55% 45% at 50% 50%, rgba(148,197,255,0.07) 0%, transparent 70%);
    }

    /* ═══════════════════════════════════════════════
       PAGE CHROME
    ═══════════════════════════════════════════════ */
.theme-toggle {
      position: fixed;
      bottom: 1.4rem;
      right: 1.4rem;
      z-index: 10;
      padding: 0.35rem 0.9rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      background: rgba(255,252,247,0.82);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-sub);
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    [data-theme='dark'] .theme-toggle {
      background: rgba(10,22,40,0.82);
    }

    .theme-toggle:hover {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }

    /* ═══════════════════════════════════════════════
       FLOATING MATH PARTICLES
    ═══════════════════════════════════════════════ */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: 8%;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      animation: particle-float var(--dur, 5s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      opacity: 0;
    }

    [data-theme='light'] .particle { color: rgba(122,158,126,0.38); }
    [data-theme='dark']  .particle { color: rgba(96,165,250,0.28);  }

    @keyframes particle-float {
      0%   { opacity: 0;   transform: translateY(0)     rotate(calc(var(--rot,-6deg) * -1)); }
      12%  { opacity: 0.9; }
      80%  { opacity: 0.5; }
      100% { opacity: 0;   transform: translateY(-130px) rotate(var(--rot, 6deg)); }
    }

    /* ═══════════════════════════════════════════════
       MAIN SPLASH — CENTRED STACK
    ═══════════════════════════════════════════════ */
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      z-index: 2;
    }

    /* ═══════════════════════════════════════════════
       THE ORRERY SVG ANIMATIONS
    ═══════════════════════════════════════════════ */

    /* Nucleus halo pulsing */
    .nucleus-halo {
      transform-origin: 180px 180px;
      animation: halo-breathe 2.8s ease-in-out infinite;
    }
    @keyframes halo-breathe {
      0%, 100% { transform: scale(0.90); opacity: 0.55; }
      50%       { transform: scale(1.10); opacity: 1.00; }
    }

    /* Nucleus sphere micro-pulse */
    .nucleus-sphere {
      transform-origin: 180px 180px;
      animation: sphere-pulse 3.5s ease-in-out infinite;
    }
    @keyframes sphere-pulse {
      0%, 100% { transform: scale(1.000); }
      50%       { transform: scale(1.035); }
    }

/* Orbit label fade-in with stagger */
    .orbit-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 7.5px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      animation: label-in 0.8s ease-out forwards;
    }
    .orbit-label--a { fill: rgba(122,158,126,0.60); animation-delay: 1.2s; }
    .orbit-label--b { fill: rgba(196,149,106,0.58); animation-delay: 1.6s; }
    .orbit-label--c { fill: rgba(169,154,180,0.60); animation-delay: 2.0s; }

    [data-theme='dark'] .orbit-label--a { fill: rgba(148,197,255,0.50); }
    [data-theme='dark'] .orbit-label--b { fill: rgba(196,181,253,0.50); }
    [data-theme='dark'] .orbit-label--c { fill: rgba(251,191,36,0.45);  }

    @keyframes label-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ═══════════════════════════════════════════════
       BRAND + STATUS
    ═══════════════════════════════════════════════ */
    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(2.2rem, 4vw, 3rem);
      letter-spacing: -0.04em;
      color: var(--primary-dark);
      line-height: 1;
      animation: brand-in 1s ease-out 0.4s both;
      transition: color 0.5s ease;
    }
    @keyframes brand-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 0.52rem;
      padding: 0.42rem 1.1rem;
      background: rgba(255,252,247,0.82);
      border: 1px solid var(--border);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      animation: brand-in 0.8s ease-out 0.7s both;
      transition: background 0.5s ease, border-color 0.5s ease;
    }

    [data-theme='dark'] .status-row {
      background: rgba(10,22,40,0.84);
    }

    .status-text {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text-sub);
      transition: opacity 0.3s ease, color 0.5s ease;
    }

    .dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .dots span {
      display: block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--primary);
      animation: dot-bounce 1.15s ease-in-out infinite;
      transition: background 0.5s ease;
    }
    .dots span:nth-child(2) { animation-delay: 0.16s; }
    .dots span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes dot-bounce {
      0%, 100% { transform: translateY(0);      }
      50%       { transform: translateY(-3.5px); }
    }
  </style>
</head>
<body>

  <!-- ── Theme toggle (corner only) ── -->
  <button class="theme-toggle" id="themeBtn">☾ Dark Mode</button>

  <!-- ── Floating math + nature particles ── -->
  <div class="particles" aria-hidden="true">
    <span class="particle" style="left:9%;  font-size:20px; --delay:0.0s; --dur:5.2s; --rot:7deg">π</span>
    <span class="particle" style="left:74%; font-size:15px; --delay:1.4s; --dur:4.8s; --rot:-5deg">∑</span>
    <span class="particle" style="left:88%; font-size:18px; --delay:2.8s; --dur:5.6s; --rot:9deg">√</span>
    <span class="particle" style="left:31%; font-size:13px; --delay:0.9s; --dur:4.5s; --rot:-8deg">∞</span>
    <span class="particle" style="left:54%; font-size:16px; --delay:3.6s; --dur:5.0s; --rot:5deg">λ</span>
    <span class="particle" style="left:18%; font-size:12px; --delay:4.8s; --dur:4.6s; --rot:-6deg">Δ</span>
    <span class="particle" style="left:44%; font-size:14px; --delay:2.1s; --dur:5.4s; --rot:4deg">φ</span>
    <span class="particle" style="left:82%; font-size:13px; --delay:5.5s; --dur:4.9s; --rot:-7deg">∫</span>
    <span class="particle" style="left:62%; font-size:11px; --delay:1.7s; --dur:5.1s; --rot:6deg">Ω</span>
    <span class="particle" style="left:5%;  font-size:10px; --delay:3.2s; --dur:5.8s; --rot:-4deg">α</span>
  </div>

  <!-- ── Main Animation ── -->
  <main class="splash">

    <!--
      THE ORRERY
      ─────────────────────────────────────────────
      A classical orrery (mechanical planetary model) re-imagined
      as a botanical atom. Three orbital ellipses at 0°/60°/120°
      carry STEM-themed markers:
        · Leaf     (Biology)   — sage green
        · Hexagon  (Chemistry) — terracotta
        · Star     (Physics)   — lavender
      A Fibonacci spiral anchors the composition to nature and math.
    -->
    <svg viewBox="0 0 360 360" width="310" height="310"
         xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="Animated orrery loading indicator">

      <defs>
        <!-- ── Nucleus radial gradient (light) ── -->
        <radialGradient id="nuc-light" cx="38%" cy="32%" r="68%">
          <stop offset="0%"   stop-color="#f3ffe6"/>
          <stop offset="25%"  stop-color="#8dd9b3"/>
          <stop offset="62%"  stop-color="#4e8860"/>
          <stop offset="100%" stop-color="#2a4f3a"/>
        </radialGradient>

        <!-- ── Nucleus radial gradient (dark) ── -->
        <radialGradient id="nuc-dark" cx="38%" cy="32%" r="68%">
          <stop offset="0%"   stop-color="#c8e8ff"/>
          <stop offset="25%"  stop-color="#4a78ee"/>
          <stop offset="62%"  stop-color="#1a3585"/>
          <stop offset="100%" stop-color="#060e2a"/>
        </radialGradient>

        <!-- ── Nucleus inner gleam ── -->
        <radialGradient id="nuc-gleam" cx="36%" cy="30%" r="54%">
          <stop offset="0%"   stop-color="rgba(255,255,255,0.40)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0.00)"/>
        </radialGradient>

        <!-- ── Halo radial gradient (light) ── -->
        <radialGradient id="halo-light" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="rgba(168,197,172,0.35)"/>
          <stop offset="70%"  stop-color="rgba(168,197,172,0.08)"/>
          <stop offset="100%" stop-color="rgba(168,197,172,0.00)"/>
        </radialGradient>

        <!-- ── Halo radial gradient (dark) ── -->
        <radialGradient id="halo-dark" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="rgba(96,165,250,0.30)"/>
          <stop offset="70%"  stop-color="rgba(96,165,250,0.06)"/>
          <stop offset="100%" stop-color="rgba(96,165,250,0.00)"/>
        </radialGradient>

        <!-- ── Glow filter for orbital dots ── -->
        <filter id="dot-glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="2.5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- ── Sphere drop shadow ── -->
        <filter id="sphere-shadow" x="-40%" y="-30%" width="180%" height="180%">
          <feDropShadow dx="0" dy="7" stdDeviation="9"
            flood-color="rgba(80,60,40,0.22)" flood-opacity="1"/>
        </filter>

        <!--
          ── ORBIT PATHS (for animateMotion) ──
          Full ellipse = two symmetric half-arc segments.
          Formula for axis-endpoint at rotation θ:
            Px = cx + rx·cos(θ),  Py = cy + rx·sin(θ)
          Orbit A θ=0°:   Px=(308,180) → (52,180)
          Orbit B θ=60°:  Px=(238,280.5) → (122,79.5)
          Orbit C θ=120°: Px=(125,275.3) → (235,84.7)
        -->
        <path id="path-a"
          d="M 308,180
             A 128,46 0 1 0 52,180
             A 128,46 0 1 0 308,180 Z"/>

        <path id="path-b"
          d="M 238,280.5
             A 116,42 60 1 0 122,79.5
             A 116,42 60 1 0 238,280.5 Z"/>

        <path id="path-c"
          d="M 125,275.3
             A 110,40 120 1 0 235,84.7
             A 110,40 120 1 0 125,275.3 Z"/>
      </defs>

      <!-- ══════════════════════════════════════════
           LAYER 1 — Scientific background elements
      ══════════════════════════════════════════ -->


      <!-- ══════════════════════════════════════════
           LAYER 2 — Orbital rings (dashed ellipses)
      ══════════════════════════════════════════ -->

      <!-- Orbit A — horizontal, sage -->
      <ellipse cx="180" cy="180" rx="128" ry="46"
        fill="none"
        stroke="rgba(90,130,95,0.80)"
        stroke-width="1.5"
        stroke-dasharray="5.5 3.5"/>

      <!-- Orbit B — tilted 60°, slightly warmer -->
      <ellipse cx="180" cy="180" rx="116" ry="42"
        fill="none"
        stroke="rgba(140,108,75,0.76)"
        stroke-width="1.5"
        stroke-dasharray="5.5 3.5"
        transform="rotate(60 180 180)"/>

      <!-- Orbit C — tilted 120°, lavender-sage -->
      <ellipse cx="180" cy="180" rx="110" ry="40"
        fill="none"
        stroke="rgba(120,100,148,0.74)"
        stroke-width="1.5"
        stroke-dasharray="5.5 3.5"
        transform="rotate(120 180 180)"/>

      <!-- ══════════════════════════════════════════
           LAYER 3 — Nucleus
      ══════════════════════════════════════════ -->

      <!-- Outer halo glow -->
      <circle class="nucleus-halo" cx="180" cy="180" r="45"
        fill="url(#halo-light)"
        id="el-halo"/>

      <!-- Outer ring (fine circle) -->
      <circle cx="180" cy="180" r="37"
        fill="none"
        stroke="rgba(122,158,126,0.20)"
        stroke-width="0.8"/>

      <!-- Main sphere -->
      <circle class="nucleus-sphere" cx="180" cy="180" r="28"
        fill="url(#nuc-light)"
        filter="url(#sphere-shadow)"
        id="el-nucleus"/>

      <!-- Gleam highlight -->
      <circle cx="180" cy="180" r="28" fill="url(#nuc-gleam)"/>

      <!-- ══════════════════════════════════════════
           LAYER 4 — Orbital markers
      ══════════════════════════════════════════ -->

      <!--
        Each marker is a <g> containing a shape around (0,0).
        animateMotion translates the group to follow the orbit path.
        rotate="auto" tilts the shape to follow path tangent.
      -->

      <!-- ── Dot A: BIOLOGY — sage leaf ── -->
      <g filter="url(#dot-glow)">
        <g>
          <!-- Leaf scaled ×1.45 -->
          <path d="M 0,-9.5
                   C  5,-5  5.8,1.5  0, 9.5
                   C -5.8, 1.5  -5,-5  0,-9.5 Z"
            fill="#7A9E7E"/>
          <line x1="0" y1="-7.8" x2="0" y2="7.8"
            stroke="rgba(255,255,255,0.38)" stroke-width="0.8" stroke-linecap="round"/>
          <animateMotion dur="5.7s" repeatCount="indefinite" rotate="auto">
            <mpath href="#path-a"/>
          </animateMotion>
        </g>
      </g>

      <!-- ── Dot B: CHEMISTRY — terracotta hexagon ── -->
      <g filter="url(#dot-glow)">
        <g>
          <!-- Hexagon scaled ×1.45 -->
          <polygon points="0,-8.4 7.27,-4.2 7.27,4.2 0,8.4 -7.27,4.2 -7.27,-4.2"
            fill="#C4956A"/>
          <!-- Inner hexagon for depth -->
          <polygon points="0,-4.4 3.8,-2.2 3.8,2.2 0,4.4 -3.8,2.2 -3.8,-2.2"
            fill="rgba(255,255,255,0.22)"/>
          <animateMotion dur="8.3s" repeatCount="indefinite" rotate="none">
            <mpath href="#path-b"/>
          </animateMotion>
        </g>
      </g>

      <!-- ── Dot C: PHYSICS — lavender 4-point star ── -->
      <g filter="url(#dot-glow)">
        <g>
          <!-- 4-point star scaled ×1.45 -->
          <path d="M 0,-10.2
                   L  2.6,-2.6
                   L  10.2, 0
                   L  2.6,  2.6
                   L  0,   10.2
                   L -2.6,  2.6
                   L -10.2, 0
                   L -2.6, -2.6 Z"
            fill="#A99AB4"/>
          <!-- Center dot -->
          <circle r="2.0" fill="rgba(255,255,255,0.50)"/>
          <animateMotion dur="6.7s" repeatCount="indefinite" rotate="none">
            <mpath href="#path-c"/>
          </animateMotion>
        </g>
      </g>

      <!-- ══════════════════════════════════════════
           LAYER 5 — Orbit discipline labels
           Positioned at the "start" of each orbit path
           (the rightmost / bottom-most point)
      ══════════════════════════════════════════ -->

      <!-- BIOLOGY — right of orbit A's east pole -->
      <text x="314" y="176" class="orbit-label orbit-label--a" text-anchor="start">
        BIOLOGY
      </text>

      <!-- CHEMISTRY — below orbit B's south pole (238,280.5) -->
      <text x="244" y="296" class="orbit-label orbit-label--b" text-anchor="middle">
        CHEMISTRY
      </text>

      <!-- PHYSICS — below orbit C's south pole (125,275.3) -->
      <text x="116" y="296" class="orbit-label orbit-label--c" text-anchor="middle">
        PHYSICS
      </text>

    </svg><!-- end SVG orrery -->

    <!-- ── Brand ── -->
    <p class="brand">Primoria</p>

    <!-- ── Status pill ── -->
    <div class="status-row">
      <span class="status-text" id="status-msg">正在准备学习空间</span>
      <span class="dots" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </div>

  </main><!-- end .splash -->

  <script>
    /* ── Dark mode toggle ── */
    const btn = document.getElementById('themeBtn');
    btn.addEventListener('click', () => {
      const html = document.documentElement;
      const isDark = html.dataset.theme === 'dark';
      html.dataset.theme = isDark ? 'light' : 'dark';
      btn.textContent = isDark ? '☾ Dark Mode' : '☀ Light Mode';

      // Swap SVG gradients for nucleus + halo
      const nucleus = document.getElementById('el-nucleus');
      const halo    = document.getElementById('el-halo');
      nucleus.setAttribute('fill', isDark ? 'url(#nuc-light)'  : 'url(#nuc-dark)');
      halo.setAttribute   ('fill', isDark ? 'url(#halo-light)' : 'url(#halo-dark)');

      // Swap dark-mode orbit stroke colors via inline style
      const orbits = document.querySelectorAll('.splash ellipse');
      if (!isDark) {
        orbits[0].setAttribute('stroke', 'rgba(96,165,250,0.30)');
        orbits[1].setAttribute('stroke', 'rgba(148,130,220,0.28)');
        orbits[2].setAttribute('stroke', 'rgba(130,100,200,0.26)');
      } else {
        orbits[0].setAttribute('stroke', 'rgba(122,158,126,0.30)');
        orbits[1].setAttribute('stroke', 'rgba(150,128,100,0.26)');
        orbits[2].setAttribute('stroke', 'rgba(140,120,160,0.24)');
      }
    });

    /* ── Loading message rotation ── */
    const messages = [
      '正在准备学习空间',
      'Loading your learning space',
      'Calibrating the knowledge map',
      '探索学习宇宙中',
      'Mapping the STEM universe',
    ];
    let msgIndex = 0;
    const msgEl = document.getElementById('status-msg');
    msgEl.style.transition = 'opacity 0.3s ease';

    setInterval(() => {
      msgEl.style.opacity = '0';
      setTimeout(() => {
        msgIndex = (msgIndex + 1) % messages.length;
        msgEl.textContent = messages[msgIndex];
        msgEl.style.opacity = '1';
      }, 320);
    }, 2800);
  </script>

</body>
</html>

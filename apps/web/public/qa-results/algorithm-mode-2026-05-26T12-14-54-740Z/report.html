function roleFor(list,key,prop='index'){const hit=(list||[]).find(h=>h[prop]===key); return hit&&hit.role;}
function arrayView(step){const arr=step.array||{}; const values=arr.values||[]; const nums=values.map(v=>typeof v==='number'?v:parseFloat(v)||0); const max=Math.max(...nums,1); const w=46,gap=5,pad=10,maxH=110,base=132; const root=svg('svg',{viewBox:'0 0 '+(pad*2+values.length*(w+gap)-gap)+' 162',style:'width:100%;max-width:720px;display:block'}); const ptr=new Map(); (arr.pointers||step.pointers||[]).forEach(p=>{const labels=ptr.get(p.index)||[]; labels.push(p.label); ptr.set(p.index,labels);}); values.forEach((v,i)=>{const role=(arr.sortedIndices||[]).includes(i)?'sorted':roleFor(arr.highlights,i); const [fill,stroke]=rs(role); const h=Math.max((nums[i]/max)*maxH,18); const x=pad+i*(w+gap),y=base-h; const group=svg('g',{}); const r=svg('rect',{x,y,width:w,height:h,rx:5,fill,stroke,'stroke-width':1.5}); const text=svg('text',{x:x+w/2,y:y+h/2+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':13,'font-weight':500,fill:'#3a352d'}); text.textContent=v; group.append(r,text); const labels=ptr.get(i)||[]; labels.forEach((label,j)=>{const t=svg('text',{x:x+w/2,y:base+14+j*12,'text-anchor':'middle','font-size':10,fill:'#6b6357'}); t.textContent=label; group.append(t);}); root.append(group);}); return root;}
function graphView(step){const graph=step.graph||{}; const nodes=graph.nodes||[],edges=graph.edges||[],high=graph.highlights||[]; const nodeMap=new Map(nodes.map(n=>[n.id,n])); const wrap=document.createElement('div'); wrap.style.cssText='display:flex;gap:10px;align-items:flex-start;width:100%;justify-content:center'; const s=svg('svg',{viewBox:'0 0 360 240',style:'width:100%;max-width:520px;display:block'}); function nx(n){return 28+(Number(n.x)||0)*304} function ny(n){return 28+(Number(n.y)||0)*184} edges.forEach((e,i)=>{const a=nodeMap.get(e.from),b=nodeMap.get(e.to); if(!a||!b)return; const line=svg('line',{x1:nx(a),y1:ny(a),x2:nx(b),y2:ny(b),stroke:'#d5c9b8','stroke-width':1.5}); s.append(line); if(e.weight!=null){const t=svg('text',{x:(nx(a)+nx(b))/2,y:(ny(a)+ny(b))/2-5,'text-anchor':'middle','font-size':10,fill:'#6b6357'});t.textContent=e.weight;s.append(t);} }); nodes.forEach(n=>{const role=roleFor(high,n.id,'nodeId'); const [fill,stroke]=rs(role); const g=svg('g',{}); const c=svg('circle',{cx:nx(n),cy:ny(n),r:21,fill,stroke,'stroke-width':1.5}); const t=svg('text',{x:nx(n),y:ny(n)+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':12,'font-weight':500,fill:'#3a352d'}); t.textContent=n.label||n.id; g.append(c,t); if(n.value!=null){const v=svg('text',{x:nx(n),y:ny(n)+36,'text-anchor':'middle','font-size':10,fill:'#6b6357'});v.textContent=n.value;g.append(v);} s.append(g);}); wrap.append(s); if((graph.queue||[]).length||(graph.stack||[]).length){const q=document.createElement('div'); q.className='queue'; [['QUEUE',graph.queue],['STACK',graph.stack]].forEach(([title,items])=>{if(!items||!items.length)return; const tt=document.createElement('div');tt.className='queue-title';tt.textContent=title;q.append(tt);items.forEach(id=>{const it=document.createElement('div');it.className='queue-item';it.textContent=id;q.append(it);});}); wrap.append(q);} return wrap;}
function treeView(step){const tree=step.tree||{}; const nodes=tree.nodes||[]; if(!nodes.length)return document.createTextNode('No tree data'); const nodeMap=new Map(nodes.map(n=>[n.id,n])); const root=nodes.find(n=>!n.parentId)||nodes[0]; const depths=new Map(); const q=[[root.id,0]]; let maxDepth=0; while(q.length){const [id,d]=q.shift(); depths.set(id,d); maxDepth=Math.max(maxDepth,d); const n=nodeMap.get(id); if(n&&n.left)q.push([n.left,d+1]); if(n&&n.right)q.push([n.right,d+1]);} let count=0; const slots=new Map(); function inorder(id){if(!id)return; const n=nodeMap.get(id); if(!n)return; inorder(n.left); slots.set(id,count++); inorder(n.right);} inorder(root.id); const width=Math.max(180,56*(count||1)+50),height=80+70*maxDepth; const s=svg('svg',{viewBox:'0 0 '+width+' '+height,style:'width:100%;max-width:620px;display:block'}); function cx(id){return 28+(slots.get(id)||0)*56} function cy(id){return 32+(depths.get(id)||0)*70} nodes.forEach(n=>{if(!n.parentId)return; s.append(svg('line',{x1:cx(n.parentId),y1:cy(n.parentId)+20,x2:cx(n.id),y2:cy(n.id)-20,stroke:'#d5c9b8','stroke-width':1.5}));}); nodes.forEach(n=>{const role=roleFor(tree.highlights,n.id,'id'); const [fill,stroke]=rs(role); const c=svg('circle',{cx:cx(n.id),cy:cy(n.id),r:21,fill,stroke,'stroke-width':1.5}); const t=svg('text',{x:cx(n.id),y:cy(n.id)+1,'text-anchor':'middle','dominant-baseline':'middle','font-size':12,'font-weight':500,fill:'#3a352d'}); t.textContent=n.value; s.append(c,t);}); return s;}
function tableView(step){const tbl=step.table||{}; const wrap=document.createElement('div'); wrap.className='table-wrap'; const table=document.createElement('table'); table.className='dp-table'; if(tbl.colLabels){const tr=document.createElement('tr'); if(tbl.rowLabels)tr.append(document.createElement('th')); tbl.colLabels.forEach(l=>{const th=document.createElement('th');th.textContent=l;tr.append(th);}); table.append(tr);} (tbl.data||[]).forEach((row,r)=>{const tr=document.createElement('tr'); if(tbl.rowLabels){const th=document.createElement('th');th.textContent=tbl.rowLabels[r]||'';tr.append(th);} row.forEach((cell,c)=>{const td=document.createElement('td'); const role=(tbl.highlights||[]).find(h=>h.row===r&&h.col===c)?.role; const [fill,stroke]=rs(role); td.style.background=fill; td.style.borderColor=stroke; td.style.fontWeight=role?500:400; td.textContent=cell==null?'':cell; tr.append(td);}); table.append(tr);}); wrap.append(table); if(tbl.formula){const f=document.createElement('div');f.className='annotation';f.textContent=tbl.formula;wrap.append(f);} return wrap;}
function renderAlgorithm(container, artifact){let idx=0, timer=null; const stage=document.createElement('div'); stage.className='vis-stage'; const desc=document.createElement('div'); desc.className='desc'; const vars=document.createElement('div'); vars.className='vars'; const controls=document.createElement('div'); controls.className='controls'; const prev=document.createElement('button'),play=document.createElement('button'),next=document.createElement('button'),label=document.createElement('span'); prev.textContent='◀'; play.textContent='▶ Play'; next.textContent='▶'; label.className='meta'; const prog=document.createElement('div'); prog.className='progress'; const bar=document.createElement('div'); prog.append(bar); controls.append(prev,play,next,label); container.append(stage,desc,vars,controls,prog); function paint(){const step=artifact.steps[idx]||artifact.steps[0]; stage.replaceChildren(); if(step.kind==='array')stage.append(arrayView(step)); else if(step.kind==='graph')stage.append(graphView(step)); else if(step.kind==='tree')stage.append(treeView(step)); else if(step.kind==='table')stage.append(tableView(step)); else stage.textContent='Unsupported step kind: '+step.kind; desc.innerHTML=''; desc.append(document.createTextNode(step.description||'')); if(step.annotation){const a=document.createElement('div');a.className='annotation';a.textContent=step.annotation;desc.append(a);} vars.replaceChildren(...(step.variables||[]).map(v=>{const el=document.createElement('span');el.className='var';el.textContent=v.name+': '+v.value;return el;})); label.textContent=(idx+1)+' / '+artifact.steps.length; bar.style.width=((idx+1)/artifact.steps.length*100)+'%'; prev.disabled=idx===0; next.disabled=idx>=artifact.steps.length-1;} prev.onclick=()=>{idx=Math.max(0,idx-1);paint()}; next.onclick=()=>{idx=Math.min(artifact.steps.length-1,idx+1);paint()}; play.onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='▶ Play';return;} play.textContent='⏸ Pause'; timer=setInterval(()=>{if(idx>=artifact.steps.length-1){clearInterval(timer);timer=null;play.textContent='▶ Play';return;} idx++;paint();},700)}; paint();}
function renderCase(item,i){const section=document.createElement('section'); section.className='case-card '+item.status; section.id='case-'+item.id; section.dataset.caseId=item.id; const head=document.createElement('div'); head.className='case-head'; head.innerHTML='<div class="case-title"><span>'+(i+1)+'. '+escHtml(item.title||item.id)+'</span><span class="badge '+(item.status==='passed'?'pass':'fail')+'">'+item.status+'</span><span class="badge">'+escHtml(item.actualType)+'</span></div><p class="prompt">'+escHtml(item.prompt)+'</p><code>'+escHtml(item.codeFile||'')+'</code>'+(item.error?'<div class="error-box">'+escHtml(item.error)+'</div>':''); section.append(head); const card=document.createElement('div'); card.className='tool-card'; const title=document.createElement('div'); title.className='tool-title'; title.innerHTML='<span class="tool-dot"></span><span>'+(item.artifact.type==='algorithm_visualization'?'render_algorithm · complete':'algorithm_qa · error')+'</span>'; const vis=document.createElement('div'); vis.className='visualizer'; card.append(title,vis); if(item.artifact.type==='algorithm_visualization'){const strong=document.createElement('strong'); strong.textContent=item.artifact.title; const note=document.createElement('div'); note.className='meta'; note.textContent=item.artifact.description||item.artifact.algorithm||''; vis.append(strong,note); renderAlgorithm(vis,item.artifact);} else {const box=document.createElement('div'); box.className='error-box'; box.textContent=item.artifact.description||item.error||'No artifact'; vis.append(box);} section.append(card); return section;}
function escHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
try{const list=(only?data.results.filter(r=>r.id===only):data.results); const root=document.getElementById('cases'); list.forEach((item,i)=>root.append(renderCase(item,item.order?item.order-1:i))); if(!list.length) root.textContent='No case found: '+only;}catch(e){recordRuntimeError('Report render failed',e)}
</script>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit:prod

      - name: Web type-check
        run: pnpm --filter @primoria/web typecheck

      - name: Web lint
        run: pnpm --filter @primoria/web lint

      - name: Learning-goal routing regression corpus
        run: pnpm test:learning-goal-routing

      - name: Web unit tests
        run: pnpm --filter @primoria/web test

      - name: Visualization catalog and routing contracts
        run: pnpm catalog:validate && pnpm --filter @primoria/web test:interactive-routing

      - name: KG source validation
        run: pnpm --filter @primoria/web validate:kg

      - name: Drizzle migration drift
        run: pnpm --filter @primoria/web db:check:migrations

      - name: Agent syntax and type-check
        run: node --check apps/agent/src/graph.mjs && pnpm --filter @primoria/agent typecheck

      - name: Agent unit tests
        run: pnpm test:agent

      - name: Agent graph integration
        run: pnpm test:agent:integration

      - name: Tutor answer-quality fixtures
        run: pnpm eval:tutor:validate && pnpm eval:tutor:zh:check

  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://primoria:primoria@127.0.0.1:5432/primoria
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm --filter @primoria/web build

      - name: Route bundle budgets
        run: pnpm --filter @primoria/web bundle:check

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: primoria_test
          POSTGRES_USER: primoria
          POSTGRES_PASSWORD: primoria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primoria -d primoria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://primoria:primoria_ci@127.0.0.1:5432/primoria_app_ci
      TEST_DATABASE_URL: postgresql://primoria:primoria_ci@127.0.0.1:5432/primoria_test
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap schemas
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:bootstrap

      - name: Verify bootstrap idempotence
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:bootstrap

      - name: Database tests
        run: pnpm test:db

      - name: Agent runtime database and HTTP tests
        run: pnpm --filter @primoria/agent test:runtime:db

  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: primoria_browser_test
          POSTGRES_USER: primoria
          POSTGRES_PASSWORD: primoria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primoria -d primoria_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://primoria:primoria_ci@127.0.0.1:5432/primoria_browser_test
      DATABASE_SSL: disable
      CI_LEARNING_SMOKE: "1"
      CI_ONBOARDING_SMOKE: "1"
      CI_TUTOR_RUNTIME_SMOKE: "1"
      CI_SHARE_SMOKE: "1"
      PRIMORIA_DISABLE_OUTLINE_ENRICHMENT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Bootstrap schemas
        run: pnpm db:bootstrap

      - name: Seed all knowledge graphs
        run: pnpm --filter @primoria/web db:seed:kg-all

      - name: Seed deterministic learning path
        run: pnpm --filter @primoria/web exec tsx scripts/seed-ci-learning-smoke.ts

      - name: Login-to-course-completion smoke
        run: pnpm test:learning-path:e2e

      - name: Seed deterministic onboarding account
        run: pnpm --filter @primoria/web exec tsx scripts/seed-ci-onboarding.ts

      - name: Login-to-onboarding-to-course-outline smoke
        run: pnpm test:onboarding:e2e

      - name: Seed deterministic Tutor runtime user
        run: pnpm --filter @primoria/web exec tsx scripts/seed-ci-tutor-runtime.ts

      - name: Browser-to-Web-to-Agent Tutor smoke
        run: pnpm test:tutor-runtime:e2e

      - name: Seed deterministic course-share accounts
        run: pnpm --filter @primoria/web exec tsx scripts/seed-ci-course-share.ts

      - name: Share-to-anonymous-preview-to-import smoke
        run: pnpm test:course-share:e2e

      - name: Widget renderer E2E
        run: pnpm test:widget:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  regression:
    name: Regression gate
    if: always()
    needs: [fast-checks, bundle-budget, database-integration, browser-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every regression layer
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success"

name: Viewer React GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/viewer-react-github-pages.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/schema/**'
      - 'packages/viewer-react/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: viewer-react-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve public base path
        env:
          PAGE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "VITE_PUBLIC_BASE_PATH=${PAGE_BASE_PATH:-/}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages bundle
        env:
          VITE_PUBLIC_BASE_PATH: ${{ env.VITE_PUBLIC_BASE_PATH }}
          VITE_VIEWER_DEMO_MODE: '1'
          VITE_VIEWER_DEFAULT_DEMO_ROLE: 'user'
          VITE_VIEWER_RELEASE: ${{ github.sha }}
        run: pnpm --filter @primoria/viewer-react build

      - name: Add SPA fallback
        run: cp packages/viewer-react/dist/index.html packages/viewer-react/dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/viewer-react/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Viewer React Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/viewer-react-preview.yml'
      - 'doc/viewer-react-progress.md'
      - 'docs/viewer-react-*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/schema/**'
      - 'packages/viewer-react/**'
      - 'supabase/**'

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      CF_BRANCH: ${{ github.head_ref || github.ref_name }}
      VITE_SUPABASE_URL: ${{ secrets.VIEWER_PREVIEW_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VIEWER_PREVIEW_SUPABASE_ANON_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.VIEWER_PREVIEW_SENTRY_DSN }}
      VITE_POSTHOG_KEY: ${{ secrets.VIEWER_PREVIEW_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VIEWER_POSTHOG_HOST || secrets.VIEWER_PREVIEW_POSTHOG_HOST }}
      VITE_VIEWER_RELEASE: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_VIEWER_PROJECT_NAME || 'primoria-viewer-react' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview artifact
        run: pnpm --filter @primoria/viewer-react build

      - name: Enforce bundle budget
        run: pnpm --filter @primoria/viewer-react check:bundle

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PROJECT_NAME != '' }}
        run: |
          output=$(pnpm --filter @primoria/viewer-react exec wrangler pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch "$CF_BRANCH")
          echo "$output"
          deployment_url=$(printf '%s' "$output" | grep -Eo 'https://[A-Za-z0-9._/-]+' | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo "Could not parse deployment URL from wrangler output."
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Preview smoke
        if: ${{ steps.deploy.outputs.deployment_url != '' }}
        env:
          VIEWER_PREVIEW_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: pnpm --filter @primoria/viewer-react smoke:preview

      - name: Upload preview artifact fallback
        if: ${{ steps.deploy.outputs.deployment_url == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: viewer-react-preview
          path: packages/viewer-react/dist
          if-no-files-found: error

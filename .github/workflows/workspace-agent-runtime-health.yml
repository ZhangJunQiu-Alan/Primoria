name: Workspace agent tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  pr-safe-agent-tests:
    name: PR-safe workspace agent tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace agent test bundle
        run: pnpm --filter @primoria/web workspace:agent:test

      - name: Smoke workspace agent runtime health route
        run: pnpm --filter @primoria/web workspace:agent-runtime:health-route
